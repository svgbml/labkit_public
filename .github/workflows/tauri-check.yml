name: Windows-programma compileren (controle)

# Alleen compileren (cargo check), geen installer en geen release: zo is een wijziging in
# src-tauri/ (zoals de opslagopdrachten van S273) al op een zijtak te controleren.
on:
  push:
    paths: ['src-tauri/**', '.github/workflows/tauri-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
