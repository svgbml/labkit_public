name: Windows-programma bouwen

# Start bij een nieuwe versie in package.json, bij een versietag, of met de hand (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versie lezen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Labkit-BML-windows
          path: dist/*.exe
      - name: Release maken met installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Labkit BML ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
