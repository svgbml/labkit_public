name: Windows-programma bouwen

# Start bij een nieuwe versie in package.json, bij een versietag, of met de hand (Actions → Run workflow).
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Versie lezen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx tauri build
      - name: Bestanden klaarzetten
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe "dist/Labkit-BML-${{ steps.v.outputs.version }}-setup.exe"
          cp src-tauri/target/release/labkit-bml.exe "dist/Labkit-BML-${{ steps.v.outputs.version }}-portable.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: Labkit-BML-windows
          path: dist/*.exe
      - name: Release maken met installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Labkit BML ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
