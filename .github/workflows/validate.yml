name: Validatie tegen referentiedata

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.48.0 scipy statsmodels
      - run: python -m playwright install --with-deps chromium
      - name: Alle tools doorrekenen met gepubliceerde ruwe data
        run: python tests/validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validatierapport
          path: tests/VALIDATIE.md
