name: Validatie tegen referentiedata

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tools/**'
      - 'build/**'
      - 'i18n/**'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # web/index.html is sinds S265 een build-uitvoer: hij moet passen bij src/ en de bundel
      - name: Vue-bundel klopt met src/
        run: npm ci && npx vite build && git diff --exit-code build/app.bundle.js
      - name: web/index.html klopt met de bronnen
        run: python tools/build.py --check
      - run: pip install playwright==1.48.0 scipy statsmodels scikit-posthocs opencv-python-headless numpy
      - run: python -m playwright install --with-deps chromium
      - name: Alle tools doorrekenen met gepubliceerde ruwe data
        run: python tests/validate.py
      - name: Layoutcontrole op drie schermbreedtes
        run: python tests/layout_audit.py
      - name: Robuustheidscontrole met randgevallen
        run: python tests/robust_audit.py
      - name: Engelse vertaling compleet
        run: python tests/i18n_collect.py
      - name: Opstarttijd en taalbestanden
        run: python tests/perf_budget.py
      - name: Layoutcontrole in het Engels
        run: python tests/layout_audit.py
        env:
          LABKIT_LANG: en
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validatierapport
          path: tests/VALIDATIE.md
