name: Lighthouse (snelheid en toegankelijkheid)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lighthouserc.json is mobiel (de standaard van Lighthouse: trage 4G, 4x CPU-vertraging); desktop zet de preset
        form: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lighthouse CI (3 runs per pagina)
        run: npx --yes @lhci/cli@0.14.0 autorun ${{ matrix.form == 'desktop' && '--collect.settings.preset=desktop' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-rapport-${{ matrix.form }}
          path: .lighthouseci
