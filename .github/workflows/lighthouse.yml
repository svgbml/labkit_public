name: Lighthouse (snelheid en toegankelijkheid)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lighthouse CI (3 runs per pagina)
        run: npx --yes @lhci/cli@0.14.0 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-rapport
          path: .lighthouseci
